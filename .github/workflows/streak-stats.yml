name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=RodrigoLDC&theme=github-dark-blue&hide_border=true&background=05070D&ring=2563EB&fire=38BDF8&currStreakLabel=38BDF8&sideLabels=FFFFFF&dates=8B949E
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
